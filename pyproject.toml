[project]
name = "ml_based_strategies"
version = "0.1.0"
description = "For fill later."
authors = [{ name = "jacobecode" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "skillspector",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage-threshold>=0.4.4",
    "ruff==0.17.3",
    "pre-commit>=4.1.0",
]
train = [
    "torch",
    "torchvision",
    "torchaudio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_based_strategies"]

[tool.uv.sources]
skillspector = { git = "https://github.com/NVIDIA/skillspector.git", rev = "v2.13.1" }
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--cov --cov-report=term-missing --import-mode=importlib"


[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/test/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[coverage-threshold]
line_coverage_min = 80
branch_coverage_min = 50
file_line_coverage_min = 75

[tool.ruff]
line-length = 120
exclude = [
    "**/conftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
